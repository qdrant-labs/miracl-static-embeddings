[project]
name = "download-fiqa"
version = "0.1.0"
description = "Download FiQA (BEIR) and convert it to the corpus/queries/qrels layout used by miracl-static-embeddings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.33.0",
    "pyarrow>=18.0.0",
]

[project.scripts]
download-fiqa = "download_fiqa:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
